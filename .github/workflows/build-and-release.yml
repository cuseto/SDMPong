# Builds a tested Linux distribution and platform-specific release packages
# whenever commits land on the main branch. JavaFX contains native libraries,
# so each release archive must be assembled on its target operating system.

name: Build and Release

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

    - name: Install Xvfb
      run: sudo apt-get install -y xvfb

    - name: Build and test
      run: xvfb-run --auto-servernum ./gradlew build

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          platform: linux
        - os: windows-latest
          platform: windows
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

    - name: Package Linux distribution
      if: runner.os == 'Linux'
      run: ./gradlew distZip

    - name: Package Windows distribution
      if: runner.os == 'Windows'
      run: .\gradlew.bat distZip

    - name: Name Linux archive
      if: runner.os == 'Linux'
      run: |
        for archive in app/build/distributions/*.zip; do
          mv "$archive" "${archive%.zip}-${{ matrix.platform }}.zip"
        done

    - name: Name Windows archive
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Get-ChildItem app/build/distributions/*.zip |
          Rename-Item -NewName { "$($_.BaseName)-${{ matrix.platform }}$($_.Extension)" }

    - name: Upload distribution
      uses: actions/upload-artifact@v4
      with:
        name: pong-${{ matrix.platform }}-distribution
        path: app/build/distributions/*-${{ matrix.platform }}.zip
        if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

    - name: Read version from build.gradle
      id: get_version
      run: echo "version=$(./gradlew -q printVersion)" >> "$GITHUB_OUTPUT"

    - name: Download release packages
      uses: actions/download-artifact@v4
      with:
        pattern: pong-*-distribution
        path: release-assets
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: Release v${{ steps.get_version.outputs.version }}
        files: release-assets/*.zip
